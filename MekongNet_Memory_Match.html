<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MekongNet Memory Match</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;color:#252a30}
button,input{font:inherit}
.app{max-width:900px;margin:auto;min-height:100vh;background:white}
.top{background:#ef6b1d;padding:16px;text-align:center}
.logo{height:58px;max-width:260px;object-fit:contain}
.screen{display:none;padding:20px}
.screen.active{display:block}
.hero{text-align:center;padding:24px 10px}
h1{font-size:clamp(38px,8vw,64px);line-height:.95;margin:18px 0 8px;font-weight:900;letter-spacing:-2px}
h1 span{color:#ef6b1d}.sub{color:#666;margin:8px 0 24px}
.primary{background:#ef6b1d;color:white;border:0;border-radius:16px;padding:16px 34px;font-size:19px;font-weight:900;box-shadow:0 4px 0 #c85313;cursor:pointer}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #c85313}
input{width:min(420px,100%);padding:15px;border:2px solid #ddd;border-radius:14px;font-size:18px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0 16px}
.stat{background:#f1f1ef;border-radius:12px;padding:9px;text-align:center}.stat small{display:block;color:#777;font-weight:700;font-size:11px}.stat strong{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:650px;margin:auto}
.card{aspect-ratio:1;border:0;background:transparent;padding:0;perspective:700px;cursor:pointer}
.inner{width:100%;height:100%;position:relative;transition:transform .28s;transform-style:preserve-3d}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.front{background:#ef6b1d;color:white;font-size:38px;font-weight:900;border:3px solid #d95b13}
.back{background:white;border:3px solid #ef6b1d;transform:rotateY(180deg);font-size:clamp(28px,7vw,48px)}
.card.matched .back{background:#fff3ea}
.result{text-align:center;padding:18px}.trophy{font-size:60px}.score{font-size:54px;color:#ef6b1d;font-weight:900;margin:8px}
.box{background:#f5f5f3;border-radius:18px;padding:16px;max-width:430px;margin:15px auto}
.leader{max-width:560px;margin:20px auto}.row{display:grid;grid-template-columns:35px 1fr 70px 85px;gap:6px;padding:11px;border-bottom:1px solid #ddd}.me{background:#fff0e6;border-radius:8px;font-weight:900}
.small{color:#777;font-size:13px;margin-top:16px}
@media(max-width:500px){.screen{padding:14px}.grid{gap:6px}.front{font-size:27px}.row{grid-template-columns:25px 1fr 55px 65px;font-size:13px}}
</style>
</head>

<section id="start" class="screen active">
<div class="hero">
<h1>MEMORY<br><span>MATCH</span></h1>
<div class="sub">FIND THE PAIRS • BEAT THE TIME • WIN A PRIZE</div>
<input id="player" maxlength="24" placeholder="Enter your name (optional)" aria-label="Player name"><br>
<button class="primary" id="play">PLAY NOW</button>
<div class="small">16 cards • 8 pairs • 45-second challenge</div>
</div>
</section>

<section id="game" class="screen">
<div class="stats">
<div class="stat"><small>TIME</small><strong id="time">45</strong></div>
<div class="stat"><small>MOVES</small><strong id="moves">0</strong></div>
<div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
</div>
<div id="grid" class="grid"></div>
<div class="small" style="text-align:center">Match all 8 pairs before time runs out.</div>
</section>

<section id="result" class="screen">
<div class="result">
<div class="trophy">🏆</div>
<h2>CONGRATULATIONS!</h2>
<div id="message" class="sub"></div>
<div class="score" id="finalScore">0</div>
<div class="box"><b id="finalName">Guest</b><div id="finalStats" class="small"></div></div>
<div class="leader">
<h3>DAILY LEADERBOARD</h3>
<div class="row"><b>#</b><b>NAME</b><b>TIME</b><b>SCORE</b></div>
<div class="row"><b>1</b><span>Sophara</span><span>18s</span><span>9,850</span></div>
<div class="row"><b>2</b><span>David</span><span>22s</span><span>8,920</span></div>
<div class="row"><b>3</b><span>Kim</span><span>25s</span><span>8,300</span></div>
<div class="row me"><b>4</b><span id="boardName">You</span><span id="boardTime">--</span><span id="boardScore">--</span></div>
</div>
<button class="primary" id="again">PLAY AGAIN</button>
</div>
</section>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const symbols=["📶","🌐","🏠","⚡","📺","🎁","🎧","🎮"];
let deck=[],first=null,second=null,locked=false,moves=0,score=0,seconds=45,matched=0,timer=null,startTime=0;
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("active",x.id===id))}
function reset(){clearInterval(timer);first=second=null;locked=false;moves=0;score=0;seconds=45;matched=0;$("time").textContent=45;$("moves").textContent=0;$("score").textContent=0}
function build(){deck=[...symbols,...symbols].sort(()=>Math.random()-.5);$("grid").innerHTML="";
deck.forEach((s,i)=>{let b=document.createElement("button");b.className="card";b.type="button";b.dataset.value=s;b.innerHTML='<div class="inner"><div class="front">M</div><div class="back">'+s+'</div></div>';b.onclick=()=>flip(b);$("grid").appendChild(b)})}
function flip(c){if(locked||c.classList.contains("open")||c.classList.contains("matched"))return;c.classList.add("open");
if(!first){first=c;return}second=c;moves++;$("moves").textContent=moves;
if(first.dataset.value===second.dataset.value){first.classList.add("matched");second.classList.add("matched");matched++;score+=Math.max(100,500-seconds*3-moves*5);$("score").textContent=score;first=second=null;if(matched===8)finish(true)}
else{locked=true;setTimeout(()=>{first.classList.remove("open");second.classList.remove("open");first=second=null;locked=false},650)}}
function start(){reset();build();show("game");startTime=Date.now();timer=setInterval(()=>{seconds--; $("time").textContent=seconds;if(seconds<=0)finish(false)},1000)}
function finish(won){clearInterval(timer);locked=true;let elapsed=Math.min(45,Math.round((Date.now()-startTime)/1000));if(won)score+=Math.max(0,(45-elapsed)*25);else score=Math.max(0,score-300);
$("finalScore").textContent=score.toLocaleString();let name=$("player").value.trim()||"Guest";$("finalName").textContent=name;$("boardName").textContent=name;$("boardTime").textContent=elapsed+"s";$("boardScore").textContent=score.toLocaleString();$("finalStats").textContent="Time: "+elapsed+"s • Moves: "+moves+" • Pairs: "+matched+"/8";$("message").textContent=won?"You completed all 8 pairs!":"Time is up — great try!";show("result")}
$("play").onclick=start;$("again").onclick=start;
})();
</script>
</body>
